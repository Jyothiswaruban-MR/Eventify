<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Eventify</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        h2, h3 {
            color: #FF0000;
            text-align: center;
        }

        /* Table Styling */
        table {
            width: 60%;
            margin: 20px 0;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        td {
            color: #333;
        }

        /* Button Styling */
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #218838;
        }

        button.logout {
            background-color: #dc3545;
        }

        button.logout:hover {
            background-color: #c82333;
        }

        /* Centering the Table and Buttons */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .logout-container {
    position: absolute;
    top: 20px;
    right: 20px;
}


        /* Responsive Styling */
        @media (max-width: 768px) {
            table {
                width: 90%;
            }
        }

        .navbar {
  width: 100%;
  padding: 15px 30px;
  background-color: #f8f9fa;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 0;
  z-index: 1001;
  display: flex;
  align-items: center;
}

.brand {
  margin: 0;
  font-size: 28px;
  color: #007bff;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

    </style>
</head>
<body>
    
      
    <div class="logout-container">
        <button class="logout" onclick="logout()">Logout</button>
    </div>
    <div class="navbar">
        <h1 class="brand">Eventify</h1>
      </div>
    
    <div class="content">
        <h2>Admin Dashboard</h2>
        <h3>Pending Organizer Approvals</h3>

        <table>
            <thead>
                <tr>
                    <th>Select</th>
                    <th>Organization ID</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="organizerList"></tbody>
        </table>

        <div>
            <button onclick="approveSelectedOrganizers()">Approve Selected</button>
        </div>
        
        <!-- New Section to Display Support Requests -->
        <h3>Pending Support Requests</h3>
        <table>
            <thead>
                <tr>
                    <th>Select</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Query</th>
                </tr>
            </thead>
            <tbody id="supportRequestList"></tbody>
        </table>
    </div>

    <script>
        async function fetchPendingOrganizers() {
            const token = localStorage.getItem('token'); // Get JWT Token

            if (!token) {
                alert("Unauthorized! Please login.");
                window.location.href = "login.html";
                return;
            }

            try {
                // Fetch organizers with isActive=false
                const response = await fetch('http://localhost:5000/api/admin/pending-organizers', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error("Failed to fetch organizers");

                const organizers = await response.json();
                const container = document.getElementById("organizerList");
                container.innerHTML = "";

                organizers.forEach(org => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td><input type="checkbox" class="approve-checkbox" value="${org._id}"></td>
                        <td>${org.organizationId}</td>
                        <td>${org.email}</td>
                    `;
                    container.appendChild(row);
                });

            } catch (error) {
                console.error("Error fetching organizers:", error);
                alert("Error loading pending organizers.");
            }
        }

        async function approveSelectedOrganizers() {
            const token = localStorage.getItem('token');
            const selectedIds = [];

            document.querySelectorAll('.approve-checkbox:checked').forEach(checkbox => {
                selectedIds.push(checkbox.value);
            });

            if (selectedIds.length === 0) {
                alert("Please select at least one organizer to approve.");
                return;
            }

            try {
                const response = await fetch('http://localhost:5000/api/admin/approve-organizers', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ organizerIds: selectedIds }) // Send selected IDs as an array
                });

                if (response.ok) {
                    alert("Selected organizers approved successfully.");
                    fetchPendingOrganizers(); // Reload list
                } else {
                    alert("Failed to approve selected organizers.");
                }
            } catch (error) {
                console.error("Error approving organizers:", error);
            }
        }

        async function fetchSupportRequests() {
            const token = localStorage.getItem('token'); // Get JWT Token

            if (!token) {
                alert("Unauthorized! Please login.");
                window.location.href = "login.html";
                return;
            }

            try {
                // Fetch support requests
                const response = await fetch('http://localhost:5000/api/support', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error("Failed to fetch support requests");

                const supportRequests = await response.json();
                const container = document.getElementById("supportRequestList");
                container.innerHTML = "";

                supportRequests.forEach(req => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td><input type="checkbox" class="support-checkbox" value="${req._id}"></td>
                        <td>${req.name}</td>
                        <td>${req.email}</td>
                        <td>${req.query}</td>
                    `;
                    container.appendChild(row);
                });

            } catch (error) {
                console.error("Error fetching support requests:", error);
                alert("Error loading support requests.");
            }
        }

        function logout() {
            localStorage.removeItem('token'); // Remove JWT
            window.location.href = "login.html";
        }

        // Fetch the data on page load
        fetchPendingOrganizers();
        fetchSupportRequests();
    </script>
</body>
</html>
