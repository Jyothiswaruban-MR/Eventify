<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Dashboard</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #f4f4f4; 
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }
        .event { 
            border: 1px solid #ddd; 
            padding: 15px; 
            margin-bottom: 15px; 
            border-radius: 5px; 
            text-align: left;
        }
        button { 
            padding: 8px 15px; 
            margin: 5px; 
            cursor: pointer; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            transition: 0.3s;
        }
        button.create { background: #4CAF50; }
        button.create:hover { background: #45a049; }
        button.delete { background: #f44336; }
        button.delete:hover { background: #d32f2f; }
        button.update { background: #0288d1; }
        button.update:hover { background: #0277bd; }
        button.logout:hover { background: #e68900; }

        h1 { margin-bottom: 10px; }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 400px;
            margin: 10% auto;
            text-align: left;
        }
        .modal input, .modal textarea {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }
        .close {
            float: right;
            cursor: pointer;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>My Events</h1>
            <button class="logout" onclick="logout()">Logout</button>
        </div>
        <button class="create" onclick="window.location.href='create-event.html'">+ Create Event</button>
        <div id="eventsContainer"></div>
    </div>



   
    <!-- Modal for Editing Event -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Edit Event</h2>
            <form id="editEventForm">
                <input type="hidden" id="eventId">
                <input type="text" id="editTitle" placeholder="Event Title" required>
                <input type="text" id="editCategory" placeholder="Category" required>
                <input type="date" id="editDate" required>
                <input type="time" id="editTime" required>
                <input type="text" id="editLocation" placeholder="Location" required>
                <textarea id="editDescription" placeholder="Description" rows="4" required></textarea>
                <input type="number" id="editCapacity" placeholder="Capacity" min="1" required>
                <button type="submit">Update Event</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api/events';
        const token = localStorage.getItem('token');

        if (!token) window.location.href = 'login.html';

        // Extract userId from token
        function getUserIdFromToken() {
            try {
                const payload = JSON.parse(atob(token.split('.')[1])); // Decode token
                return payload.userId; // Return organizerId
            } catch (error) {
                console.error("Invalid token", error);
                return null;
            }
        }

        const organizerId = getUserIdFromToken();
        if (!organizerId) {
            alert("Invalid token. Please log in again.");
            window.location.href = "login.html";
        }

        // Fetch events for the organizer
        async function loadEvents() {
            try {
                const res = await fetch(`${API_URL}/organizer/${organizerId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const { events } = await res.json();
                renderEvents(events);
            } catch (err) {
                alert('Error loading events');
                console.error(err);
            }
        }

        // Render events to DOM
        function renderEvents(events) {
            const container = document.getElementById('eventsContainer');
            container.innerHTML = events.length ? '' : '<p>No events found</p>';

            events.forEach(event => {
                const eventDiv = document.createElement('div');
                eventDiv.className = 'event';
                eventDiv.innerHTML = `
                    <h3>${event.title}</h3>
                    <p><strong>Date:</strong> ${new Date(event.date).toLocaleDateString()} at ${event.time}</p>
                    <p><strong>Location:</strong> ${event.location}</p>
                    <p><strong>Description:</strong> ${event.description}</p>
                    <p><strong>Attendees:</strong> ${event.attendees.length}/${event.capacity}</p>
                    <button class="update" onclick="openModal('${event._id}', '${event.title}', '${event.category}', '${event.date}', '${event.time}', '${event.location}', '${event.description}', '${event.capacity}')">Update</button>
                    <button class="delete" onclick="deleteEvent('${event._id}')">Delete</button>
                `;
                container.appendChild(eventDiv);
            });
        }

        // Open the modal with event data
        function openModal(id, title, category, date, time, location, description, capacity) {
            document.getElementById("eventId").value = id;
            document.getElementById("editTitle").value = title;
            document.getElementById("editCategory").value = category;
            document.getElementById("editDate").value = new Date(date).toISOString().split('T')[0];
            document.getElementById("editTime").value = time;
            document.getElementById("editLocation").value = location;
            document.getElementById("editDescription").value = description;
            document.getElementById("editCapacity").value = capacity;

            document.getElementById("editModal").style.display = "block";
        }

        // Close the modal
        function closeModal() {
            document.getElementById("editModal").style.display = "none";
        }

        // Delete event
async function deleteEvent(eventId) {
    if (!confirm("Are you sure you want to delete this event?")) return;

    try {
        const res = await fetch(`${API_URL}/${eventId}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${token}` }
        });

        const data = await res.json();
        if (res.ok) {
            alert("Event deleted successfully!");
            loadEvents(); // Refresh event list
        } else {
            alert(data.message || "Failed to delete event.");
        }
    } catch (err) {
        console.error("Error deleting event:", err);
        alert("Error deleting event.");
    }
}


        // Update event
        document.getElementById("editEventForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const eventId = document.getElementById("eventId").value;
            const updatedEvent = {
                title: document.getElementById("editTitle").value,
                category: document.getElementById("editCategory").value,
                date: document.getElementById("editDate").value,
                time: document.getElementById("editTime").value,
                location: document.getElementById("editLocation").value,
                description: document.getElementById("editDescription").value,
                capacity: document.getElementById("editCapacity").value
            };

            await fetch(`${API_URL}/${eventId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify(updatedEvent)
            });

            alert("Event updated!");
            closeModal();
            loadEvents();
        });

        // Logout function
        function logout() {
            localStorage.removeItem('token');
            alert("Logged out successfully!");
            window.location.href = 'login.html';
        }

        // Initialize
        loadEvents();
    </script>

    
</body>
</html>
