<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Eventify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: url('images/register.jpg') no-repeat center center;
            background-size: cover;
            margin: 50px;
            background-color: rgba(0,0,0,0.5);
            color: white;
        }

        .register-container {
            background-color: #fff;
            color: black;
            width: 100%;
            margin: auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }

        .register-container h2 {
            margin-bottom: 20px;
        }

        .register-container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .register-container input:focus {
            border-color: #FF6347;
            outline: none;
        }

        .register-container button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        .register-container button:hover {
            background-color: darkblue;
        }

        p {
            margin-top: 15px;
        }

        p a {
            color: blue;
            text-decoration: none;
        }

        /* Initially hide the organization ID input */
        .organization-input {
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Eventify User Registration</h2>
        <form id="registerForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            
            <!-- Organizer checkbox -->
            <label for="organizerCheckbox">
                <input type="checkbox" id="organizerCheckbox" class="organization-checkbox">
                Are you an organizer?
            </label>

            <!-- Organization ID input (only visible if the checkbox is checked) -->
            <div class="organization-input">
                <input type="text" id="organizationId" placeholder="Organization ID">
            </div>

            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="login.html">Login</a></p>
    </div>

    <script>
        // JavaScript to handle visibility toggle for organization ID input
        document.getElementById('organizerCheckbox').addEventListener('change', function() {
    const orgInput = document.getElementById('organizationId');
    const orgDiv = document.querySelector('.organization-input');

    if (this.checked) {
        orgDiv.style.display = 'block';
        orgInput.setAttribute('required', 'true'); // Add required when checked
    } else {
        orgDiv.style.display = 'none';
        orgInput.removeAttribute('required'); // Remove required when unchecked
    }
});

        // Prevent form submission and page reload
        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent form reload

            // Get form input values
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const isOrganizer = document.getElementById('organizerCheckbox').checked;
            const organizationId = isOrganizer ? document.getElementById('organizationId').value : null;
            const isApproved = !isOrganizer; // Set isApproved to false for organizers

            // Prepare data to be sent
            const registrationData = {
                name,
                email,
                password,
                role: isOrganizer ? 'organizer' : 'participant',  // Add 'role' for user or organizer
                isApproved,
                organizationId
            };

            // Log data to the console for debugging

            // Send data to the server using Fetch API
            try {
                const response = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(registrationData),

                });

                const result = await response.json();

                if (response.ok) {
                    alert(result.message); // Show success message
                    document.getElementById('registerForm').reset();
                    window.location.href = 'login.html';

                } else {
                    alert(`Error: ${result.message}`); // Show error message
                }
            } catch (error) {
                console.error('Error during registration:', error);
                alert('An error occurred while registering. Please try again.');
            }
        });
    </script>
</body>
</html>
